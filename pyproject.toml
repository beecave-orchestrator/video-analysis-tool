[project]
name = "video-nsfw-tagger"
version = "0.1.0"
description = "Local, offline, privacy-first NSFW video analysis CLI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "typer[all]>=0.27.0",
    "rich>=15.0.0",
    # ROCm torch wheels are scoped to the pytorch-rocm source below so PDM
    # never resolves the CUDA-only PyPI builds. See [[tool.pdm.source]].
    "torch>=2.5",
    "torchvision>=0.19",
    "transformers>=4.40,<5",
    "pillow",
    "safetensors",
    "ollama>=0.4.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
    "typing-extensions>=4.15.0",
    "docstr-coverage>=2.3.2",
    "interrogate>=1.7.0",
]

[project.scripts]
vnt = "video_nsfw_tagger.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pdm]
distribution = false

# ROCm torch wheels (AMD GPU). Scoped so only torch/torchvision resolve from
# this index; all other deps come from PyPI. This prevents PDM from pulling
# the CUDA-only PyPI torch builds on `pdm install`/`pdm lock`.
[[tool.pdm.source]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
include_packages = ["torch", "torchvision", "pytorch-triton-rocm"]
exclude_packages = ["*"]

[tool.pdm.scripts]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
fix = "ruff check --fix ."
test = "pytest -q"
test-cov = "pytest --cov=. --cov-report=term-missing:skip-covered --cov-report=xml"

[tool.ruff]
line-length = 88
target-version = "py310"
preview = true

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "N",
    "I",
    "D",
    "DOC",
    "ANN",
    "TID",
    "UP",
    "FA",
]
extend-select = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
markers = [
    "integration: mark tests that hit real external integrations or slower paths",
    "slow: mark tests that are slow or require model downloads",
]
